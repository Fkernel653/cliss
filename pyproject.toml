[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliss"
version = "0.6.0"
description = "A lightweight framework for building CLI applications on top of argparse"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Fkernel653"}
]
keywords = ["cli", "argparse", "command-line", "framework", "lightweight"]
classifiers = [
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Topic :: Utilities",
]
dependencies = [
    "color-kiss",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/Fkernel653/cliss"
Repository = "https://github.com/Fkernel653/cliss.git"
Documentation = "https://github.com/Fkernel653/cliss#readme"

[tool.hatch.build.targets.wheel]
include = ["cliss*"]
