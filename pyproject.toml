[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cliss"
version = "1.2.5"
description = "Write type-annotated Python functions, get a full CLI — automatic `--help`, validation, async support, and zero dependencies"
readme = "README.md"
requires-python = ">=3.10"
license = "LGPL-3.0-only"
authors = [
    {name = "Fkernel653"}
]
keywords = ["cli", "command-line", "framework", "library", "libraries", "lib", "lightweight", "lgplv3"]
classifiers = [
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: User Interfaces",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[project.optional-dependencies]
dev = ["ruff"]

[project.urls]
Homepage = "https://github.com/Fkernel653/cliss"
Repository = "https://github.com/Fkernel653/cliss.git"
Documentation = "https://github.com/Fkernel653/cliss#readme"

[tool.hatch.build.targets.wheel]
include = ["cliss*"]
